<html lang="ru">
<head>
    {% load static %}     
    <meta charset="UTF-8">
    <title>Каталог фильмов</title>
    <style>
        body { font-family: Arial; background: #111; color: #eee; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 50px; }
        .movie { width: 300px; background: #222; border-radius: 10px; padding: 10px; text-align: center; }
        img { width: 100%; border-radius: 10px; }
        a { color: #ffcc00; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">🎬 Каталог фильмов</h1>
    <div class="container">
        {% for movie in movies %}
        <div class="movie">
            <img src="{% static movie.poster %}" alt="{{ movie.title }}">
            <h2>{{ movie.title }}</h2>
            <p>{{ movie.description }}</p>
            <a href="{{ movie.trailer }}" target="_blank">Смотреть трейлер</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>


<div class="movie">
    <img src="{% static movie.poster %}" alt="{{ movie.title }}">

    <iframe width="560" height="315"
